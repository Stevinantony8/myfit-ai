<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#07111F" />
  <title>MYFIT AI — Personal Wellness & Fitness Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <header class="topbar">
      <button class="brand" data-action="home" aria-label="MYFIT AI home">
        <span class="brand-mark"><span></span><span></span><span></span></span>
        <span>MYFIT <b>AI</b></span>
      </button>
      <div class="topbar-actions">
        <button class="icon-btn" data-action="privacy" title="Privacy controls" aria-label="Privacy controls">⌘</button>
        <button class="text-btn" data-action="reset">Reset</button>
      </div>
    </header>

    <main id="main-content" class="main-content"></main>

    <nav id="bottom-nav" class="bottom-nav" aria-label="Primary navigation">
      <button data-action="dashboard"><span>⌂</span><small>Home</small></button>
      <button data-action="plan"><span>✦</span><small>Plan</small></button>
      <button data-action="progress"><span>◴</span><small>Progress</small></button>
      <button data-action="privacy"><span>◌</span><small>Profile</small></button>
    </nav>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
